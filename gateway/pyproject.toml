[project]
name = "gateway"
version = "0.1.0"
description = "OpenAI-compatible gateway in front of TensorRT-LLM and vLLM"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["live: needs a real engine; set ENGINE_URL"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110

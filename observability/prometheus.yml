global:
  scrape_interval: 5s # short, so a benchmark run of a minute still draws a curve

scrape_configs:
  - job_name: gpu
    static_configs:
      - targets: ["dcgm-exporter:9400"]

  - job_name: trtllm
    # Not /metrics: on trtllm-serve that path is a JSON queue emptied by each read.
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ["trtllm:8000"]

  - job_name: vllm
    static_configs:
      - targets: ["vllm:8000"]

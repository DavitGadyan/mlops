{{- $component := dict "root" . "component" "ui" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ui
  labels:
    {{- include "qwen7b.labels" $component | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "qwen7b.selector" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "qwen7b.labels" $component | nindent 8 }}
    spec:
      containers:
        - name: ui
          image: {{ required "Set images.ui to the image built from ui/." .Values.images.ui }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GATEWAY_URL
              value: http://{{ .Release.Name }}-gateway:8080
            # Read by the UI's server side only; it never reaches the browser.
            - name: GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "qwen7b.apiKeySecret" . }}
                  key: api-key
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ui
  labels:
    {{- include "qwen7b.labels" $component | nindent 4 }}
spec:
  selector:
    {{- include "qwen7b.selector" $component | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ui
  labels:
    {{- include "qwen7b.labels" $component | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ required "Set ingress.host." .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-ui
                port:
                  name: http
{{- end }}
